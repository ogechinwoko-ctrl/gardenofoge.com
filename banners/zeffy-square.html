<!doctype html><html><head><meta charset="utf-8"><title>Zeffy square banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600&family=DM+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="shared.css">
<style>
body{width:1200px;height:1200px;position:relative}
.photo{position:absolute;inset:0 0 auto 0;height:560px}
.photo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 45% 50% at 50% 38%,rgb(12 20 10/.45),transparent 75%),linear-gradient(180deg,rgb(12 20 10/.2),rgb(12 20 10/.35))}
.wave{position:absolute;left:0;top:500px;width:1200px;height:90px}
.logo{position:absolute;top:70px;left:50%;transform:translateX(-50%);height:300px;z-index:2}
.content{position:absolute;left:90px;right:90px;top:640px}
.label{font-size:24px}
h1{font-size:104px;margin:22px 0 30px}
p.lead{font-size:30px;line-height:1.45;color:var(--on-leaf);max-width:30ch}
.spaces{position:absolute;left:90px;right:90px;bottom:70px;font-size:21px;display:flex;justify-content:space-between;border-top:1px solid rgb(238 242 228/.2);padding-top:26px}
</style></head><body>
<div class="photo"></div>
<svg class="wave" viewBox="0 0 1200 90" preserveAspectRatio="none"><path d="M0 40 C 250 95 470 95 690 48 S 1040 5 1200 50 L1200 90 L0 90Z" fill="#23402a"/><path d="M0 40 C 250 95 470 95 690 48 S 1040 5 1200 50" fill="none" stroke="#95e57e" stroke-width="4"/></svg>
<span class="logo"></span>
<div class="content">
  <span class="label">The build campaign · Mechanicsville, Atlanta</span>
  <h1>Plant a <em>stake</em> in what we're building</h1>
  <p class="lead">Help us finish a garden, studio, and gathering place for the neighborhood.</p>
</div>
<div class="spaces"><span><b>●</b> The Garden</span><span>The Commons</span><span>The Caterpillar</span><span>The Studio</span></div>
</body></html>
